apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  NODE_ENV: "production"
  #Route traffic to the internal Kubernetes Kafka service
  KAFKA_BROKER: "kafka-cluster-kafka-bootstrap:9092"
  KAFKA_GROUP_ID: "notification-group"
  KAFKA_TOPIC_READ_TICKET: "ticket-management-events"
  KAFKA_TOPIC_READ_ORG: "organization-access-events"
  KAFKA_TOPIC_READ_BILLING: "billing-events"
  KAFKA_TOPIC_WRITE: "notification-events"
  #Route traffic to an email service
  NODEMAILER_HOST: "sandbox.smtp.mailtrap.io"
  NODEMAILER_PORT: "2525"
  SupportTeamEmail: "support@supporthub.com"